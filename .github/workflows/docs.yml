name: Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - ".github/workflows/docs.yml"
  # manual run
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    defaults:
      run:
        working-directory: docs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Pages
        id: pages
        uses: actions/configure-pages@v6

      - name: Install mdBook
        run: cargo install mdbook --no-default-features --features search --vers "^0.5" --locked

      - name: Install mdbook-mermaid
        run: cargo install mdbook-mermaid --vers "^0.17" --locked

      - name: Build book
        run: mdbook build

      # RFC 137 §7 increment 3: the landing page (docs/landing/) is the site root, the built book
      # goes under /docs/. docs.yml's own `paths:` filter is already `docs/**`, so docs/landing/
      # needs no filter change. Staged outside the repository tree (under $RUNNER_TEMP) so nothing
      # new appears under docs/ -- no .gitignore entry needed, and a local run cannot leave a third
      # directory beside src/ and book/. $RUNNER_TEMP is a plain environment variable present in
      # every runner shell; the `runner` expression context it would otherwise come from is not
      # available in a job-level `env:` block, only in step-level contexts.
      - name: Stage site
        run: |
          mkdir -p "$RUNNER_TEMP/site/docs"
          cp -r landing/. "$RUNNER_TEMP/site/"
          cp -r book/. "$RUNNER_TEMP/site/docs/"
          echo "SITE_DIR=$RUNNER_TEMP/site" >> "$GITHUB_ENV"

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ${{ env.SITE_DIR }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
