name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: read

jobs:
  # RFC 160 §9 D3: a release is mechanically tied to a green CI run. Nothing else here checked this -- the release fires on any
  # matching tag, runs no tests of its own, and never asked whether the commit it is releasing passed CI. This job is the first
  # thing that runs, `build` and `publish` both depend on it (transitively, through `build`), and it fails the whole workflow
  # unless the most recent CI run **on `main`** for this exact commit concluded `success` -- which it can only do if every job
  # in `ci.yml` succeeded, the Windows and macOS mutation suites included, since one failing job makes the whole run's own
  # conclusion non-`success`. Read-only throughout: `gh run list` with this workflow's own `GITHUB_TOKEN`, no write scope.
  #
  # Letter 015, N4: a tag push is a push, and `ci.yml` fires on every push -- so the commit being tagged has *two* CI runs, one
  # on `main` and one started by the tag push itself, created in the same second as this workflow. The gate now lives in its
  # own reusable workflow (`ci-status-gate.yml`) precisely so it filters to the `main` run and can be rehearsed with
  # `workflow_dispatch` against a commit that already has a tag run, without cutting a release to find out.
  ci-status-gate:
    uses: ./.github/workflows/ci-status-gate.yml
    permissions:
      actions: read
      contents: read

  build:
    needs: ci-status-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
          # RFC 107 Stage 2: matches ci.yml's macos-mutation/windows-mutation jobs' own runners
          # exactly, not Linux's two-architecture shape -- x86_64-apple-darwin has never actually
          # built or run in this project's CI, only been cross-compile-checked, and shipping it
          # would repeat this RFC's own defect (a platform claim resting on something unverified)
          # one level down (`RFC-107-stage-2-report-ruling-v1.md` §1).
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    name: build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      # Every command below is written out per target in full, rather than interpolating
      # matrix.target, so `tools/release-policy`'s publication-boundary scanner can verify each
      # by exact match (procedure.rs) instead of trusting a template — required for cargo, tar,
      # and rustc, which are not in the scanner's dynamic-argument-tolerant inert set.
      - name: Build (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: cargo build -p prikk --release --target x86_64-unknown-linux-gnu --locked
      - name: Build (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: cargo build -p prikk --release --target aarch64-unknown-linux-gnu --locked
      - name: Build (aarch64-apple-darwin)
        if: matrix.target == 'aarch64-apple-darwin'
        run: cargo build -p prikk --release --target aarch64-apple-darwin --locked
      - name: Build (x86_64-pc-windows-msvc)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: cargo build -p prikk --release --target x86_64-pc-windows-msvc --locked

      # Not because mutation is Linux-only -- that stopped being true at 0.21.0, when macOS and
      # Windows became mutating platforms too (criterion 6). No per-artifact mutation-limit caveat
      # is emitted anywhere in this workflow for any target; release_notes.rs derives whatever
      # platform statement a release actually needs from dist/'s own contents at publish time
      # instead (RFC 107 Stage 1), so nothing here needs to say so per target.
      - name: Package (x86_64-unknown-linux-gnu)
        if: matrix.target == 'x86_64-unknown-linux-gnu'
        run: |
          mkdir -p stage dist
          cp target/x86_64-unknown-linux-gnu/release/prikk stage/prikk
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/prikk-x86_64-unknown-linux-gnu.tar.gz prikk LICENSE
          ( cd dist && sha256sum prikk-x86_64-unknown-linux-gnu.tar.gz > prikk-x86_64-unknown-linux-gnu.tar.gz.sha256 )
          echo "target: x86_64-unknown-linux-gnu" > dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          echo "build: cargo build -p prikk --release --target x86_64-unknown-linux-gnu --locked" >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
          rustc -vV >> dist/prikk-x86_64-unknown-linux-gnu.build-info.txt
      - name: Package (aarch64-unknown-linux-gnu)
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          mkdir -p stage dist
          cp target/aarch64-unknown-linux-gnu/release/prikk stage/prikk
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/prikk-aarch64-unknown-linux-gnu.tar.gz prikk LICENSE
          ( cd dist && sha256sum prikk-aarch64-unknown-linux-gnu.tar.gz > prikk-aarch64-unknown-linux-gnu.tar.gz.sha256 )
          echo "target: aarch64-unknown-linux-gnu" > dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          echo "build: cargo build -p prikk --release --target aarch64-unknown-linux-gnu --locked" >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt
          rustc -vV >> dist/prikk-aarch64-unknown-linux-gnu.build-info.txt

      # RFC 107 Stage 2: identical shape to the Linux packaging steps above -- macOS ships GNU
      # Tar natively, matching what macos-mutation already builds and runs on. `shasum -a 256`,
      # not `sha256sum`: the current runner-image manifest lists GNU Tar/Git/curl/wget/7-Zip/gpg
      # under its utilities but no coreutils/sha256sum entry, while `shasum` is part of the base
      # OS regardless -- checked rather than assumed Linux parity
      # (`RFC-107-stage-2-report-ruling-v1.md` §2), and produces the same `<hash>  <filename>`
      # line shape `sha256sum` does.
      - name: Package (aarch64-apple-darwin)
        if: matrix.target == 'aarch64-apple-darwin'
        run: |
          mkdir -p stage dist
          cp target/aarch64-apple-darwin/release/prikk stage/prikk
          cp LICENSE stage/LICENSE
          tar -C stage -czf dist/prikk-aarch64-apple-darwin.tar.gz prikk LICENSE
          ( cd dist && shasum -a 256 prikk-aarch64-apple-darwin.tar.gz > prikk-aarch64-apple-darwin.tar.gz.sha256 )
          echo "target: aarch64-apple-darwin" > dist/prikk-aarch64-apple-darwin.build-info.txt
          echo "commit: ${GITHUB_SHA}" >> dist/prikk-aarch64-apple-darwin.build-info.txt
          echo "tag: ${GITHUB_REF_NAME}" >> dist/prikk-aarch64-apple-darwin.build-info.txt
          echo "build: cargo build -p prikk --release --target aarch64-apple-darwin --locked" >> dist/prikk-aarch64-apple-darwin.build-info.txt
          rustc -vV >> dist/prikk-aarch64-apple-darwin.build-info.txt

      # RFC 107 Stage 2: `.zip` via `Compress-Archive`, not `.tar.gz` -- a tarball containing an
      # `.exe` is technically fine and practically wrong for a Windows user
      # (design-v1.md, "What differs per platform"). Forward slashes, not backslashes: PowerShell
      # accepts `/` as a path separator on Windows exactly as it accepts `\`, and the scanner's
      # POSIX-oriented lexer treats an unquoted `\` as an escape character and silently drops it --
      # confirmed directly against the lexer, not assumed, after backslash-separated paths produced
      # tokens with the separators stripped entirely (`RFC-107-stage-2-report-ruling-v1.md` §3).
      # No pipes and no `$var = …` assignment either: both are individually well-formed PowerShell
      # but the lexer splits a pipe into separate commands and unconditionally rejects a `$`-led
      # command head as dynamic. Every line here is one command, no pipe, no assignment.
      # The checksum line matches `sha256sum`'s own shape exactly -- lowercase hex, two spaces,
      # bare filename, no path -- via a `$(...)` subexpression embedded inside a quoted
      # `Set-Content -Value`, not `Get-FileHash`'s raw redirected table output, which is neither a
      # checksum `sha256sum -c` can verify nor free of the build machine's absolute path
      # (`RFC-107-stage-2-implementation-ruling-v1.md` §1). `-NoNewline`: `Set-Content` otherwise
      # terminates with the platform newline (CRLF on Windows), and whether `sha256sum -c` strips a
      # trailing `\r` when reading the filename is exactly the kind of question only a real artifact
      # could answer -- cheaper to make the byte content deterministic than to find out
      # (`RFC-107-stage-2-checksum-fix-ruling-v1.md` §2).
      - name: Package (x86_64-pc-windows-msvc)
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: |
          New-Item -ItemType Directory -Force -Path stage, dist
          Copy-Item target/x86_64-pc-windows-msvc/release/prikk.exe stage/prikk.exe
          Copy-Item LICENSE stage/LICENSE
          Compress-Archive -Path stage/prikk.exe, stage/LICENSE -DestinationPath dist/prikk-x86_64-pc-windows-msvc.zip
          Set-Content -Path dist/prikk-x86_64-pc-windows-msvc.zip.sha256 -Value "$((Get-FileHash dist/prikk-x86_64-pc-windows-msvc.zip -Algorithm SHA256).Hash.ToLower())  prikk-x86_64-pc-windows-msvc.zip" -NoNewline
          Set-Content -Path dist/prikk-x86_64-pc-windows-msvc.build-info.txt -Value "target: x86_64-pc-windows-msvc"
          Add-Content -Path dist/prikk-x86_64-pc-windows-msvc.build-info.txt -Value "commit: $env:GITHUB_SHA"
          Add-Content -Path dist/prikk-x86_64-pc-windows-msvc.build-info.txt -Value "tag: $env:GITHUB_REF_NAME"
          Add-Content -Path dist/prikk-x86_64-pc-windows-msvc.build-info.txt -Value "build: cargo build -p prikk --release --target x86_64-pc-windows-msvc --locked"
          rustc -vV >> dist/prikk-x86_64-pc-windows-msvc.build-info.txt

      - uses: actions/upload-artifact@v7
        with:
          name: prikk-${{ matrix.target }}
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true

      # RFC 107 Stage 1: notes are assembled from CHANGELOG.md and dist/*.build-info.txt at
      # publish time rather than restated in a static file — a static file is what let the
      # platform claim go stale (rfcs/accepted/107-release-distribution-surface.md §0). $TAG is
      # not enumerable in advance, so the scanner (procedure.rs's release_notes_procedure) matches
      # on shape: every other token fixed, $TAG free to vary but the same token release-policy
      # itself will read from the environment below.
      - name: Assemble release notes
        env:
          TAG: ${{ github.ref_name }}
        run: cargo run -p prikk-release-policy --locked -- release-notes "$TAG" dist > release-notes.md

      # Universal installer/uninstaller handoff v1 §4.1: generated here and attached as a release
      # asset, never committed as a tracked .sh file -- installer.rs's own doc comment explains
      # why (reference-check's shell-command scanner cannot parse real control-flow shell syntax,
      # and the actual script text lives in templates/*.sh.txt, outside its scanned file set).
      # Checksummed the same way every other asset in this job is.
      - name: Generate installer scripts
        run: cargo run -p prikk-release-policy --locked -- generate-installer dist
      - name: Checksum installer scripts
        run: |
          ( cd dist && sha256sum install.sh > install.sh.sha256 )
          ( cd dist && sha256sum uninstall.sh > uninstall.sh.sha256 )

      # $TAG and the repository slug are written out as the literal tokens the scanner sees
      # (procedure.rs's gh() match), not templated — the tag itself cannot be enumerated in
      # advance the way the two build targets above are, so the match is on shape: a fixed
      # `release create`, the fixed asset globs, and the fixed --repo/--notes-file values, with
      # $TAG free to vary but required identical in both places it appears.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/*.tar.gz dist/*.tar.gz.sha256 dist/*.zip dist/*.zip.sha256 dist/*.build-info.txt dist/*.sh dist/*.sh.sha256 --repo prikk-vcs/prikk --title "$TAG" --notes-file release-notes.md
