[package]
name        = "prikk"
description = "A standalone distributed version control system built around block-oriented patch theory."
readme      = "../../README.md"
documentation = "https://docs.rs/prikk"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

[dependencies]
prikk-crypto                = { workspace = true }
prikk-error                 = { workspace = true }
prikk-hash                  = { workspace = true }
prikk-object                = { workspace = true }
prikk-store                 = { workspace = true }

# `test-support` is a non-default feature on `prikk-store` (design-v1.md §13.9): it is compiled only
# because these integration tests need it, never in the shipped binary above -- Cargo unifies the
# feature into the `prikk-store` build used by `tests/`, not into `src/`'s own build.
#
# `prikk-replay` (RFC 133 §6c.2): `rfc133_node_count_memory.rs`'s attribution round constructs a
# synthetic `NodeLifecycleState` via its own public `create_node` API to measure the structure's
# in-memory cost in isolation -- test-only, same reasoning as `prikk-store`'s own `test-support`
# feature above; never reachable from `src/`, which does not depend on `prikk-replay` at all.
[dev-dependencies]
prikk-store                 = { workspace = true, features = ["test-support"] }
prikk-replay                 = { workspace = true }

[package.metadata.binstall]
pkg-url = "{ repo }/releases/download/{ version }/prikk-{ target }.tar.gz"
bin-dir = "{ bin }{ binary-ext }"
pkg-fmt = "tgz"

[lints]
workspace = true

# RFC 133 §6d.3: a genuinely minimal companion binary for `tests/rfc133_node_count_memory.rs`'s
# resident-object-index probe. `[[bin]]` targets never see `[dev-dependencies]` (only test/bench/
# example targets do, regardless of how `cargo` is invoked), so it depends on `prikk-store` alone --
# already an ordinary `[dependencies]` entry above, not a new one. `required-features` keeps it out
# of an ordinary `cargo install prikk` (default features build only `src/main.rs`); the test file
# itself is `#[cfg(feature = "rusage-probe")]`-gated at the one item that names its `CARGO_BIN_EXE_*`
# path, so the workspace's own default-feature gates (`cargo test --workspace --locked`, no
# `--all-features`) still compile the file cleanly without it.
[[bin]]
name              = "rusage-object-index-probe"
path              = "src/bin/rusage_object_index_probe.rs"
required-features = ["rusage-probe"]

[features]
rusage-probe = []
