[package]
name = "prikk-benchmarks"
description = "Repository-internal Prikk performance benchmarks (RFC 126 §5). Not part of the shipped product; not built by default."
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
prikk-store = { workspace = true }

[dev-dependencies]
criterion = "0.7"
tempfile = "3"

[[bench]]
name = "commit"
harness = false

# RFC 133 §6d.5: relocated from `crates/prikk-cli` -- see the binary's own doc comment for why.
[[bin]]
name = "rusage-object-index-probe"
path = "src/bin/rusage_object_index_probe.rs"

[lints]
workspace = true
