[package]
name = "prikk-release-policy"
description = "Repository-internal Prikk release-policy verifier."
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
cargo_metadata = "0.20"
jsonschema = { version = "0.48", default-features = false }
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2.workspace = true
toml = "1.1"

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
