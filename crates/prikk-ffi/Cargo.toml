[package]
name        = "prikk-ffi"
description = "Windows filesystem-identity FFI bindings for Prikk. Internal to the prikk CLI; its API may change without notice before 1.0."
readme      = "README.md"
documentation = "https://docs.rs/prikk-ffi"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true }

[target.'cfg(target_os = "macos")'.dependencies]
libc = { workspace = true }

# DC-90: this crate is the one workspace member permitted to omit `unsafe_code = "forbid"`
# (`UNSAFE_EXEMPT_CRATES`, tools/release-policy/src/boundary/unsafe_boundary.rs). Cargo does not
# allow `[lints] workspace = true` together with any local override in the same manifest, so
# opting out of `unsafe_code` means opting out of inheritance entirely -- confirmed empirically,
# not assumed (see the DC-96 preflight investigation). The table below is the root
# `[workspace.lints]` table reproduced verbatim, minus `unsafe_code`, so this crate loses no other
# workspace lint by taking the exemption.
[lints.rust]
missing_docs = "warn"

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
indexing_slicing = "deny"
undocumented_unsafe_blocks = "forbid"
