[package]
name = "prikk-corpus"
description = "Repository-internal Prikk measurement-corpus profile format and extractor (RFC 139). Not part of the shipped product; not built by default."
readme = "README.md"
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "1.1"
prikk-hash = { workspace = true }
prikk-store = { workspace = true }
[[bin]]
name = "extract-profile"
path = "src/bin/extract_profile.rs"

[[bin]]
name = "plan-corpus"
path = "src/bin/plan_corpus.rs"

[lints]
workspace = true
