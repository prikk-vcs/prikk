[package]
name        = "prikk-object"
description = "Object identity, canonical encoding, and payload types for Prikk. Internal to the prikk CLI; its API may change without notice before 1.0."
readme      = "README.md"
documentation = "https://docs.rs/prikk-object"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

[features]
# A test seam for the collision rule (`fold_one_more_pair_for_test`): never enabled in a shipped build, and a no-op unless a test
# arms it. `prikk-store`'s `test-support` enables it.
test-support = []

[dependencies]
prikk-error                 = { workspace = true }
prikk-hash                  = { workspace = true }
unicode-normalization       = { workspace = true }
unicase                     = { workspace = true }

[dev-dependencies]
proptest                    = { workspace = true }

[lints]
workspace = true
