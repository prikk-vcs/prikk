[workspace]
resolver = "3"
members = [
    "crates/prikk-cli",
    "crates/prikk-crypto",
    "crates/prikk-error",
    "crates/prikk-ffi",
    "crates/prikk-hash",
    "crates/prikk-object",
    "crates/prikk-replay",
    "crates/prikk-store",
    "tools/benchmarks",
    "tools/corpus",
    "tools/release-policy",
    "tools/test-support",
]
default-members = [
    "crates/prikk-cli",
    "crates/prikk-crypto",
    "crates/prikk-error",
    "crates/prikk-ffi",
    "crates/prikk-hash",
    "crates/prikk-object",
    "crates/prikk-replay",
    "crates/prikk-store",
]

[workspace.package]
version         = "0.54.1"
edition         = "2024"
rust-version    = "1.85"
license             = "Apache-2.0"
authors             = ["nabbisen"]
repository          = "https://github.com/prikk-vcs/prikk"
homepage            = "https://prikk.org/"
# RFC 128 §4: "algorithms" is not a real fit for a VCS. `development-tools` and
# `command-line-utilities` are the closest real crates.io category slugs -- verified against the
# live category list (https://crates.io/api/v1/categories) and its `development-tools`
# subcategories, which has no version-control-specific entry at any level.
categories          = ["development-tools", "command-line-utilities"]
keywords            = ["vcs", "version-control", "dvcs", "patch", "merge"]

[workspace.dependencies]
prikk-crypto                = { version = "0.54.1", path = "crates/prikk-crypto" }
prikk-error                 = { version = "0.54.1", path = "crates/prikk-error" }
prikk-ffi                   = { version = "0.54.1", path = "crates/prikk-ffi" }
prikk-hash                  = { version = "0.54.1", path = "crates/prikk-hash" }
prikk-object                = { version = "0.54.1", path = "crates/prikk-object" }
prikk-replay                = { version = "0.54.1", path = "crates/prikk-replay" }
prikk-store                 = { version = "0.54.1", path = "crates/prikk-store" }
# 0.55.0 G2 Part A: `publish = false`, like `prikk-benchmarks`/`prikk-corpus` below -- never
# published, so no `version` to pin (there is no crates.io release to resolve against). Listed here,
# not left absent like those two, because this one is a real dependency edge: `prikk`'s own
# `[dev-dependencies]` needs it, and new dependency edges in this workspace go through
# `[workspace.dependencies]`.
prikk-test-support          = { path = "tools/test-support" }

ed25519-dalek               = "3"
getrandom                   = "0.4"
rustix                      = { version = "1", features = ["fs", "process"] }
sha2                        = "0.11"
# DC-96: pinned to the version already resolved in the dependency graph (via rustix->errno and
# tempfile) so this direct edge does not add a second copy. Verify against Cargo.lock before
# bumping, not just this comment.
windows-sys                 = { version = "=0.61.2", features = ["Win32_Storage_FileSystem", "Win32_Foundation", "Win32_System_Threading"] }

# Testing
proptest                    = "1"


[profile.dev]
# 0.54.0 Part G1, item 2: `-O1` for this workspace's own crates, `-O2` for every dependency --
# dependencies rebuild rarely (their own code never changes between local edits) so paying their
# optimization cost once at `-O2` is free; this workspace's own crates rebuild on every edit, so
# `-O1` is the lever that actually shortens the inner loop. Debug assertions, overflow checks,
# debug info, and every release-profile setting are untouched -- only `opt-level` moves.
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[workspace.lints.rust]
unsafe_code         = "forbid"
missing_docs        = "warn"

[workspace.lints.clippy]
unwrap_used         = "deny"
expect_used         = "deny"
indexing_slicing    = "deny"
# DC-90: goes here, at the workspace root, and not in any individual crate's manifest --
# see tools/release-policy/src/boundary/unsafe_boundary.rs's module doc for why. "forbid", not
# "deny": deny can be locally overridden by an inner #[allow], which the crate this lint exists
# to constrain could otherwise use to remove its own guard in one line.
undocumented_unsafe_blocks = "forbid"
