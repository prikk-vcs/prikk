[book]
title = "Prikk"
authors = ["nabbisen"]
language = "en"
src = "src"

[output.html]
git-repository-url = "https://github.com/prikk-vcs/prikk"
additional-js = ["mermaid.min.js", "mermaid-init.js"]
# RFC 137 §7 increment 2. Sets the <base href="..."> mdBook writes into the generated 404 page
# (verified in docs/book/404.html, not assumed from the manual -- other pages use relative paths
# and carry no <base> tag at all): without it, <base href="/">, so a 404 served at
# /docs/guide/nope.html resolves its relative CSS refs against the site root and gets
# a path that does not exist. site-url is a HOST-root path, not a site-root one -- RFC 137 §7
# increment 5 moved the book to the domain apex (prikk.org/docs/), paired with `homepage` in
# Cargo.toml -- both changed in the same commit, since neither is correct without the other.
site-url = "/docs/"

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
