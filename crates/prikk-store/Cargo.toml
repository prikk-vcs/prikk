[package]
name        = "prikk-store"
description = "Repository storage engine for Prikk -- layout, object storage, WAL durability, verification, and patch replay. Internal to the prikk CLI; its API may change without notice before 1.0."
readme      = "README.md"
# RFC 114 Gate B's committed repository fixtures are test evidence, not library content.
exclude     = ["tests/fixtures"]
documentation = "https://docs.rs/prikk-store"
version.workspace       = true
edition.workspace       = true
rust-version.workspace  = true
license.workspace       = true
authors.workspace       = true
repository.workspace    = true
homepage.workspace      = true
categories.workspace    = true
keywords.workspace      = true

[features]
# Non-default. Exposes storage-damaging simulation helpers (e.g. dropping one ref's pointer entry)
# as genuinely `pub` API, for use by other crates' integration tests only -- never enabled in a
# shipped build. RFC 102 Stage 4 design-v1.md §13.9: nothing outside `#[cfg(test)]` or the
# feature-gated module itself may reference anything gated by this feature. Because the gate set's
# `--all-features` run is the only build that ever compiles this feature, a build *without* it is
# never exercised -- so a violation of that condition would silently make feature-gated code
# load-bearing for ordinary compilation without any build ever failing to reveal it. Checkable only
# by review; must be checked, not assumed.
test-support = ["prikk-object/test-support"]

[dependencies]
prikk-crypto                = { workspace = true }
prikk-error                 = { workspace = true }
prikk-hash                  = { workspace = true }
prikk-object                = { workspace = true }
prikk-replay                = { workspace = true }

getrandom                   = { workspace = true }

# 0.58.0 step 0a: every call into `prikk-ffi` is under `cfg(windows)` or `cfg(target_os = "macos")` (`extract.rs`, `lock_holder.rs`,
# `foundation/fsutil/anchored/windows*.rs`); on Linux the crate compiles to nothing, and Cargo 1.100's `unused_dependencies` said so.
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
prikk-ffi                   = { workspace = true }

# Every `rustix` call is in unix-only code (the anchored directory and regular-file modules, `lock_holder`'s unix probe, and
# `extract`'s no-replace rename); on Windows the crate was unused (Cargo 1.100's `unused_dependencies`).
[target.'cfg(unix)'.dependencies]
rustix                      = { workspace = true }

[dev-dependencies]
proptest                    = { workspace = true }

[lints]
workspace = true
